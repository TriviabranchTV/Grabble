name = "grabble"
main = "src/index.js"
compatibility_date = "2026-09-23"
routes = [{ pattern = "grabble.triviabranch.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "GrabbleRoom" },
  { name = "ADMIN", class_name = "GrabbleAdmin" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrabbleRoom", "GrabbleAdmin"]

# Cloudflare build retrigger 2026-09-24T16:31Z

[vars]
TBLIVE_REGISTRY_URL = "https://tblive.triviabranch.com"
